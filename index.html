<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>ClassGram Influencer Game</title>
<style>
  :root{
    --bg:#fafafa;
    --card:#fff;
    --text:#111;
    --muted:#737373;
    --line:#dbdbdb;
    --accent:#0095f6;
    --danger:#ed4956;
    --soft:#f2f2f2;
    --shadow:0 4px 18px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  button,input,textarea{font:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  .app{max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg)}
  .topbar{
    position:sticky;top:0;z-index:20;
    height:62px;background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;backdrop-filter:blur(12px)
  }
  .brand{font-size:25px;font-weight:800;letter-spacing:-1px}
  .teacher-btn{border:none;background:transparent;font-size:23px;padding:8px}
  .screen{padding:24px 16px 40px}
  .panel{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:24px;box-shadow:var(--shadow)
  }
  h1,h2,h3,p{margin-top:0}
  h1{font-size:28px;letter-spacing:-.5px}
  h2{font-size:22px}
  .sub{color:var(--muted);line-height:1.5}
  .field{margin:18px 0}
  label{display:block;font-weight:700;margin-bottom:8px}
  input,textarea{
    width:100%;border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;background:#fff;outline:none
  }
  input:focus,textarea:focus{border-color:#aaa;box-shadow:0 0 0 3px rgba(0,149,246,.08)}
  textarea{min-height:84px;resize:vertical}
  .primary{
    width:100%;border:none;border-radius:11px;padding:13px 16px;
    background:var(--accent);color:#fff;font-weight:800
  }
  .secondary{
    border:1px solid var(--line);border-radius:11px;padding:11px 14px;
    background:#fff;font-weight:700
  }
  .danger{background:var(--danger);color:#fff;border:none}
  .group-setup{display:grid;gap:12px;margin-top:18px}
  .group-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:start}
  .group-num{font-weight:800;color:var(--muted)}
  .feed{padding:16px 0 48px}
  .group-tabs{
    display:flex;gap:8px;overflow:auto;padding:10px 16px 14px;
    position:sticky;top:62px;z-index:15;background:rgba(250,250,250,.96);
    border-bottom:1px solid #eee;backdrop-filter:blur(10px)
  }
  .group-tab{
    white-space:nowrap;border:1px solid var(--line);background:white;
    padding:9px 13px;border-radius:999px;font-weight:700
  }
  .group-tab.active{background:#111;color:#fff;border-color:#111}
  .post{
    background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    margin-bottom:18px
  }
  .post-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
  .identity{display:flex;align-items:center;gap:10px;min-width:0}
  .avatar{
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;font-weight:900;color:#fff;
    background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7);
    flex:0 0 auto
  }
  .userline{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .groupline{font-size:12px;color:var(--muted);margin-top:2px}
  .post-image{
    aspect-ratio:1/1;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:#fff;padding:30px;position:relative;overflow:hidden;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer
  }
  .post-image::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.38),transparent 30%);
    pointer-events:none
  }
  .big-heart{
    position:absolute;left:50%;top:50%;z-index:5;
    transform:translate(-50%,-50%) scale(0);
    font-size:96px;opacity:0;pointer-events:none;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))
  }
  .big-heart.pop{animation:heartPop .72s ease-out}
  @keyframes heartPop{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    18%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
    42%{transform:translate(-50%,-50%) scale(.95);opacity:1}
    62%{transform:translate(-50%,-50%) scale(1.05);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1);opacity:0}
  }
  .post-image::after{
    content:"";position:absolute;inset:10%;border:2px solid rgba(255,255,255,.45);border-radius:24px
  }
  .post-image .ootd{position:relative;z-index:1}
  .ootd-title{font-size:46px;font-weight:950;letter-spacing:-1.5px}
  .ootd-sub{font-size:24px;font-weight:800;margin-top:8px}
  .actions{display:flex;align-items:center;gap:14px;padding:12px 14px 6px}
  .icon-btn{border:none;background:transparent;padding:0;font-size:29px;line-height:1}
  .icon-btn.liked{color:var(--danger);transform:scale(1.08)}
  .likes{font-weight:800;padding:0 14px 8px}
  .caption{padding:0 14px 10px;line-height:1.4}
  .caption b{margin-right:5px}
  .comments{padding:0 14px 8px}
  .comment{margin:6px 0;line-height:1.35}
  .comment b{margin-right:6px}
  .comment-time{font-size:11px;color:var(--muted);margin-left:6px}
  .comment-box{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid #efefef}
  .comment-box input{border:none;background:transparent;padding:8px 0}
  .comment-box button{border:none;background:transparent;color:var(--accent);font-weight:800}
  .chooser{
    position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;
    display:flex;align-items:flex-end;justify-content:center
  }
  .sheet{
    width:min(760px,100%);background:#fff;border-radius:22px 22px 0 0;
    padding:18px 16px 28px;max-height:78vh;overflow:auto
  }
  .sheet h3{text-align:center;margin-bottom:8px}
  .sheet .sub{text-align:center;font-size:14px}
  .account-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
  .account-btn{
    border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;
    text-align:left;font-weight:800
  }
  .account-btn span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
  .teacher-panel{display:grid;gap:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--soft);border-radius:12px;padding:12px;text-align:center}
  .stat strong{display:block;font-size:22px}
  .teacher-list{display:grid;gap:8px}
  .teacher-item{padding:12px;background:var(--soft);border-radius:12px}
  .tiny{font-size:12px;color:var(--muted)}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#111;color:#fff;padding:10px 14px;border-radius:999px;
    font-weight:700;z-index:80;box-shadow:var(--shadow)
  }
  @media(min-width:700px){
    .post{border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .feed{padding-left:16px;padding-right:16px}
  }
</style>
</head>
<body>
<div class="app">
  <div id="setupScreen" class="screen">
    <div class="panel">
      <h1>📸 ClassGram</h1>
      <p class="sub">Today’s influencer activity is ready with 4 group accounts.</p>
      <div class="teacher-list" style="margin:18px 0">
        <div class="teacher-item"><b>Group 1</b> · @black</div>
        <div class="teacher-item"><b>Group 2</b> · @teamkenji</div>
        <div class="teacher-item"><b>Group 3</b> · @three</div>
        <div class="teacher-item"><b>Group 4</b> · @jackiesfashion.ch</div>
      </div>
      <button class="primary" type="button" onclick="startFixedClassGram()">Start ClassGram</button>
    </div>
  </div>

  <div id="mainScreen" class="hidden">
    <header class="topbar">
      <div class="brand">ClassGram</div>
      <button class="teacher-btn" id="teacherBtn" aria-label="Teacher controls">⚙️</button>
    </header>

    <div class="group-tabs" id="groupTabs"></div>
    <main class="feed" id="feed"></main>
  </div>
</div>

<div id="accountChooser" class="chooser hidden">
  <div class="sheet">
    <h3>Who are you?</h3>
    <p class="sub" id="chooserMessage">Choose your group before commenting.</p>
    <div id="accountGrid" class="account-grid"></div>
    <button class="secondary" style="width:100%;margin-top:12px" id="cancelChooser">Cancel</button>
  </div>
</div>

<div id="postMenuModal" class="chooser hidden">
  <div class="sheet" style="padding-top:10px">
    <button id="editPostAction" type="button"
      style="width:100%;border:none;background:#fff;padding:18px 12px;font-weight:800;font-size:18px;border-bottom:1px solid #eee">
      ✏️編集
    </button>
    <button id="cancelPostMenu" type="button"
      style="width:100%;border:none;background:#fff;padding:18px 12px;font-weight:700;font-size:17px">
      キャンセル
    </button>
  </div>
</div>

<div id="editModal" class="chooser hidden">
  <div class="sheet">
    <h3>✏️編集</h3>
    <p class="sub" id="editAccountLabel"></p>
    <div class="field">
      <label for="editCaptionInput">Caption</label>
      <textarea id="editCaptionInput" maxlength="300" placeholder="Write your caption..."></textarea>
    </div>
    <button class="primary" id="saveCaptionBtn" type="button">保存</button>
    <button class="secondary" style="width:100%;margin-top:10px" id="cancelEditBtn" type="button">キャンセル</button>
  </div>
</div>

<div id="teacherModal" class="chooser hidden">
  <div class="sheet">
    <h3>Teacher Controls</h3>
    <div id="teacherStats" class="teacher-panel"></div>
    <button class="secondary" style="width:100%;margin-top:12px" id="closeTeacher">Close</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const STORAGE_KEY = "classgram_v1";
let state = loadState() || {
  ready:false,
  groups:[],
  activityTitle:"Today's OOTD",
  caption:"Check out our OOTD! ✨ Tell us what you think in the comments.",
  activePost:0
};

let pendingAction = null;

const $ = id => document.getElementById(id);

function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadState(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
  catch(e){ return null; }
}
function esc(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
function cleanUsername(v, index){
  let s = (v || "").trim().replace(/^@+/,"").replace(/\s+/g,"_");
  return s || `group_${index+1}`;
}
function showToast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.remove("hidden");
  setTimeout(()=>t.classList.add("hidden"),1500);
}

function init(){
  const required=["black","teamkenji","three","jackiesfashion.ch"];
  const valid=state.ready &&
    state.groups &&
    state.groups.length===4 &&
    state.groups.every((g,i)=>g.username===required[i]);

  if(valid){
    $("setupScreen").classList.add("hidden");
    $("mainScreen").classList.remove("hidden");
    render();
  }else{
    state.ready=false;
    state.groups=[];
    saveState();
  }
}
function safeId(i=0){
  return "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,10) + "_" + i;
}

function goToAccountSetup(){
  try{
    const n=Math.max(1,Math.min(20,parseInt($("groupCount").value,10)||1));
    const holder=$("groupSetupList");
    holder.innerHTML="";
    for(let i=0;i<n;i++){
      const row=document.createElement("div");
      row.className="group-row";
      row.innerHTML=
        '<div class="group-num">Group '+(i+1)+'</div>' +
        '<div style="display:grid;gap:8px">' +
          '<input class="groupNameInput" placeholder="Group name / username" value="group_'+(i+1)+'" />' +
          '<input class="groupTitleInput" placeholder="Post title (example: Our OOTD)" value="Our OOTD" />' +
          '<textarea class="groupCaptionInput" placeholder="Write your post caption...">Check out our OOTD! ✨</textarea>' +
        '</div>';
      holder.appendChild(row);
    }
    $("step1").classList.add("hidden");
    $("step2").classList.remove("hidden");
    window.scrollTo(0,0);
  }catch(err){
    alert("ClassGram could not open the account setup screen. Please open this page in Safari or through GitHub Pages, not in the Files preview.\n\nError: " + err.message);
  }
}

function startFixedClassGram(){
  const fixedGroups = [
    {number:1, username:"black"},
    {number:2, username:"teamkenji"},
    {number:3, username:"three"},
    {number:4, username:"jackiesfashion.ch"}
  ];

  const captionPool = [
    "Serving today’s look ✨ What do you think?",
    "A little style, a lot of confidence 😎",
    "Today’s fit is ready for the spotlight 📸",
    "Keeping it simple, keeping it stylish 💫",
    "Our look of the day — rate the fit! 🔥",
    "Fashion check! Would you wear this? 👀",
    "This is our vibe today ✨",
    "Walking into class like it’s a runway 😎",
    "Today’s style speaks for itself 💯",
    "Just another day, another outfit 📸"
  ];

  // Shuffle captions so every group receives a different one each new activity.
  const shuffled = captionPool.slice();
  for(let i=shuffled.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }

  state.groups=fixedGroups.map((g,i)=>({
    id:safeId(i),
    number:g.number,
    username:g.username,
    title:"Our OOTD",
    caption:shuffled[i],
    likes:0,
    comments:[]
  }));

  state.activePost=0;
  state.ready=true;
  saveState();
  $("setupScreen").classList.add("hidden");
  $("mainScreen").classList.remove("hidden");
  window.scrollTo(0,0);
  render();
}

function startClassGram(){
  try{
    const names=Array.from(document.querySelectorAll(".groupNameInput"));
    const titles=Array.from(document.querySelectorAll(".groupTitleInput"));
    const captions=Array.from(document.querySelectorAll(".groupCaptionInput"));
    state.groups=names.map((inp,i)=>({
      id:safeId(i),
      number:i+1,
      username:cleanUsername(inp.value,i),
      title:(titles[i]?.value || "Our OOTD").trim() || "Our OOTD",
      caption:(captions[i]?.value || "Check out our OOTD! ✨").trim() || "Check out our OOTD! ✨",
      likes:0,
      comments:[]
    }));
    state.activePost=0;
    state.ready=true;
    saveState();
    $("setupScreen").classList.add("hidden");
    $("mainScreen").classList.remove("hidden");
    window.scrollTo(0,0);
    render();
  }catch(err){
    alert("ClassGram could not start. Please open this page in Safari or through GitHub Pages.\n\nError: " + err.message);
  }
}

function render(){
  renderTabs();
  renderFeed();
}
function renderTabs(){
  const tabs=$("groupTabs"); tabs.innerHTML="";
  state.groups.forEach((g,i)=>{
    const b=document.createElement("button");
    b.className="group-tab"+(state.activePost===i?" active":"");
    b.textContent=`Group ${g.number} · @${g.username}`;
    b.onclick=()=>{state.activePost=i;saveState();render();};
    tabs.appendChild(b);
  });
}
const groupBackgrounds = [
  /* Group 1 - BLACK */
  "linear-gradient(135deg,#050505 0%,#252525 48%,#000000 100%)",

  /* Group 2 - BLUE */
  "linear-gradient(135deg,#48cae4 0%,#0077b6 50%,#03045e 100%)",

  /* Group 3 - GREEN */
  "linear-gradient(135deg,#80ed99 0%,#2d6a4f 50%,#081c15 100%)",

  /* Group 4 - PINK */
  "linear-gradient(135deg,#ff8fab 0%,#c9184a 50%,#590d22 100%)",

  /* Group 5 - PURPLE */
  "linear-gradient(135deg,#c77dff 0%,#7b2cbf 50%,#240046 100%)",

  /* Group 6 - ORANGE */
  "linear-gradient(135deg,#ffba08 0%,#f48c06 50%,#9d0208 100%)",

  /* Group 7 - TEAL */
  "linear-gradient(135deg,#72efdd 0%,#168aad 50%,#184e77 100%)",

  /* Group 8 - RED */
  "linear-gradient(135deg,#ff758f 0%,#c9184a 50%,#641220 100%)",

  /* Group 9 - GOLD */
  "linear-gradient(135deg,#ffe169 0%,#d4a017 50%,#7f4f24 100%)",

  /* Group 10 - NAVY */
  "linear-gradient(135deg,#778da9 0%,#415a77 50%,#0d1b2a 100%)"
];

function backgroundForGroup(index){
  return groupBackgrounds[index % groupBackgrounds.length];
}

function renderFeed(){
  const feed=$("feed"); feed.innerHTML="";
  const g=state.groups[state.activePost];
  if(!g) return;
  const post=document.createElement("article");
  post.className="post";
  const commentsHtml=g.comments.map(c=>`
    <div class="comment"><b>@${esc(c.author)}</b>${esc(c.text)}
      <span class="comment-time">${esc(c.time||"")}</span>
    </div>`).join("");
  post.innerHTML=`
    <div class="post-head">
      <div class="identity">
        <div class="avatar">${esc((g.username[0]||"G").toUpperCase())}</div>
        <div>
          <div class="userline">Group ${g.number} · @${esc(g.username)}</div>
          <div class="groupline">${esc(g.title)}</div>
        </div>
      </div>
      <button class="icon-btn" id="postMenuBtn" type="button" aria-label="Edit post" style="font-size:24px;padding:10px 12px;min-width:48px;min-height:44px">•••</button>
    </div>
    <div class="post-image" id="postImage" style="background:${backgroundForGroup(state.activePost)}" aria-label="Double tap to like">
      <div class="big-heart" id="bigHeart">❤️</div>
      <div class="ootd">
        <div class="ootd-title">Group ${g.number}</div>
        <div class="ootd-sub">@${esc(g.username)}</div>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="likeBtn">♡</button>
      <button class="icon-btn" id="commentFocusBtn">💬</button>
    </div>
    <div class="likes">${g.likes} ${g.likes===1?"like":"likes"}</div>
    <div class="caption"><b>Group ${g.number} · @${esc(g.username)}</b>${esc(g.caption)}</div>
    <div class="comments">${commentsHtml || '<div class="tiny">No comments yet. Be the first!</div>'}</div>
    <div class="comment-box">
      <input id="commentInput" placeholder="Add a comment..." maxlength="180" />
      <button id="postCommentBtn">Post</button>
    </div>
  `;
  feed.appendChild(post);

  $("postMenuBtn").onclick=function(){ openPostMenu(state.activePost); };

  $("likeBtn").onclick=()=>{
    anonymousLike(state.activePost);
    showBigHeart();
  };

  const postImage=$("postImage");
  let lastTap=0;
  postImage.addEventListener("pointerup",e=>{
    const now=Date.now();
    if(now-lastTap<340){
      e.preventDefault();
      anonymousLike(state.activePost);
      showBigHeart();
      lastTap=0;
    }else{
      lastTap=now;
    }
  });

  $("postCommentBtn").onclick=()=>{
    const text=$("commentInput").value.trim();
    if(!text) return;
    chooseAccount({type:"comment",postIndex:state.activePost,text});
  };
  $("commentInput").addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      $("postCommentBtn").click();
    }
  });
  $("commentFocusBtn").onclick=()=>$("commentInput").focus();
}


let audioCtx = null;
function playLikeSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(660, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + 0.08);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.14);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.15);
  }catch(e){}
}

function showBigHeart(){
  const heart=$("bigHeart");
  if(!heart) return;
  heart.classList.remove("pop");
  void heart.offsetWidth;
  heart.classList.add("pop");
}

function anonymousLike(postIndex){
  const post = state.groups[postIndex];
  if(!post) return;
  if(typeof post.likes !== "number"){
    post.likes = Array.isArray(post.likes) ? post.likes.length : 0;
  }
  post.likes += 1;
  playLikeSound();
  saveState();
  showToast("Liked ❤️");

  const likesEl=document.querySelector(".likes");
  if(likesEl){
    likesEl.textContent=post.likes+" "+(post.likes===1?"like":"likes");
  }
}

let editingPostIndex = null;

function openPostMenu(postIndex){
  const post=state.groups[postIndex];
  if(!post) return;
  editingPostIndex=postIndex;
  $("postMenuModal").classList.remove("hidden");
}

function closePostMenu(){
  $("postMenuModal").classList.add("hidden");
}

function openCaptionEditor(){
  const post=state.groups[editingPostIndex];
  if(!post) return;
  closePostMenu();
  $("editAccountLabel").textContent="Group "+post.number+" · @"+post.username;
  $("editCaptionInput").value=post.caption || "";
  $("editModal").classList.remove("hidden");
  setTimeout(function(){
    const field=$("editCaptionInput");
    if(field) field.focus();
  },150);
}

function closeEditModal(){
  $("editModal").classList.add("hidden");
  editingPostIndex=null;
}

$("editPostAction").onclick=function(){
  openCaptionEditor();
};

$("cancelPostMenu").onclick=function(){
  closePostMenu();
  editingPostIndex=null;
};

$("cancelEditBtn").onclick=function(){
  closeEditModal();
};

$("saveCaptionBtn").onclick=function(){
  if(editingPostIndex===null) return;

  const post=state.groups[editingPostIndex];
  if(!post) return;

  const caption=$("editCaptionInput").value.trim();

  if(!caption){
    alert("Captionを入力してください。");
    return;
  }

  post.caption=caption;
  saveState();
  closeEditModal();
  render();
  showToast("Captionを保存しました ✏️");
};

function chooseAccount(action){
  pendingAction=action;
  const grid=$("accountGrid"); grid.innerHTML="";
  const target=state.groups[action.postIndex];
  $("chooserMessage").textContent=`Choose the group that is commenting on @${target.username}'s post.`;

  state.groups.forEach(g=>{
    const b=document.createElement("button");
    b.className="account-btn";
    b.innerHTML=`@${esc(g.username)}<span>Group ${g.number}</span>`;
    b.onclick=()=>performAction(g.id);
    grid.appendChild(b);
  });
  $("accountChooser").classList.remove("hidden");
}

function performAction(actorId){
  const action=pendingAction;
  const post=state.groups[action.postIndex];
  const actor=state.groups.find(g=>g.id===actorId);
  if(!action || !post || !actor) return;

  if(action.type==="comment"){
    post.comments.push({
      id:safeId(),
      author:actor.username,
      authorId:actor.id,
      text:action.text,
      time:new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
    });
    showToast(`Comment posted by @${actor.username}`);
  }
  saveState();
  $("accountChooser").classList.add("hidden");
  pendingAction=null;
  render();
}

$("cancelChooser").onclick=()=>{
  $("accountChooser").classList.add("hidden");
  pendingAction=null;
};

$("teacherBtn").onclick=()=>{
  renderTeacher();
  $("teacherModal").classList.remove("hidden");
};
$("closeTeacher").onclick=()=>$("teacherModal").classList.add("hidden");

function renderTeacher(){
  const totalLikes=state.groups.reduce((n,g)=>n+(typeof g.likes==="number"?g.likes:(Array.isArray(g.likes)?g.likes.length:0)),0);
  const totalComments=state.groups.reduce((n,g)=>n+g.comments.length,0);
  const mostLikes=[...state.groups].sort((a,b)=>(typeof b.likes==="number"?b.likes:b.likes.length)-(typeof a.likes==="number"?a.likes:a.likes.length))[0];
  const mostComments=[...state.groups].sort((a,b)=>b.comments.length-a.comments.length)[0];

  $("teacherStats").innerHTML=`
    <div class="stats">
      <div class="stat"><strong>${state.groups.length}</strong><span class="tiny">Groups</span></div>
      <div class="stat"><strong>${totalLikes}</strong><span class="tiny">Likes</span></div>
      <div class="stat"><strong>${totalComments}</strong><span class="tiny">Comments</span></div>
    </div>

    <div class="teacher-list">
      ${state.groups.map(g=>`
        <div class="teacher-item">
          <b>Group ${g.number} · @${esc(g.username)}</b><br>
          <span class="tiny">${typeof g.likes==="number"?g.likes:g.likes.length} likes · ${g.comments.length} comments</span>
        </div>
      `).join("")}
    </div>

    <div class="teacher-item">
      <b>Current leaders</b><br>
      <span class="tiny">Most likes: @${esc(mostLikes?.username||"-")} (${mostLikes ? (typeof mostLikes.likes==="number"?mostLikes.likes:mostLikes.likes.length) : 0})<br>
      Most comments: @${esc(mostComments?.username||"-")} (${mostComments?.comments.length||0})</span>
    </div>

    <button class="secondary" id="exportBtn">Copy Results Summary</button>
    <button class="secondary" id="resetEngagementBtn">Reset Likes & Comments</button>
    <button class="secondary danger" id="resetAllBtn">Start New Activity</button>
  `;

  $("exportBtn").onclick=async()=>{
    const lines=[
      "ClassGram Results",
      ...state.groups.map(g=>`Group ${g.number} @${g.username}: ${g.likes.length} likes, ${g.comments.length} comments`)
    ];
    try{
      await navigator.clipboard.writeText(lines.join("\n"));
      showToast("Results copied");
    }catch(e){
      alert(lines.join("\n"));
    }
  };
  $("resetEngagementBtn").onclick=()=>{
    if(confirm("Reset all likes and comments, but keep the group accounts?")){
      state.groups.forEach(g=>{g.likes=0;g.comments=[];});
      saveState(); renderTeacher(); render(); showToast("Likes and comments reset");
    }
  };
  $("resetAllBtn").onclick=()=>{
    if(confirm("Start a completely new activity? This will erase all groups, likes, and comments.")){
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  };
}

init();
</script>
</body>
</html>
